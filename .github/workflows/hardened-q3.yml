# Builds the hardened Keychron Q3 firmware for all six variants, records the
# SHA-256 of each binary, and publishes them (artifact, release, GitHub Pages).
#
# Toolchain is pinned to Ubuntu 24.04's gcc-arm-none-eabi 13.2.rel1-2, so rebuilding
# the same commit with that compiler reproduces the recorded hashes exactly.
# Actions are pinned by commit.
name: Hardened Keychron Q3

on:
  push:
    branches: [hardened-q3]
    tags: ['hardened-q3-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the binaries as a GitHub release (creates the tag)'
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the libraries the Q3 build needs
        run: git submodule update --init --depth 1 lib/chibios lib/chibios-contrib lib/printf lib/pico-sdk

      - name: Install the pinned toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gcc-arm-none-eabi=15:13.2.rel1-2 binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util
          arm-none-eabi-gcc --version | head -1
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements.txt qmk==1.2.0

      - name: Build all variants
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          mkdir -p out
          for v in ansi ansi_encoder iso iso_encoder jis jis_encoder; do
            if ! make "keychron/q3/$v:hardened" > build.log 2>&1; then
              # Surface the failure as annotations, which stay readable without the full log
              grep -iE "error|cannot|not found" build.log | tail -10 | sed 's/^/::error::'"$v"': /'
              exit 1
            fi
            cp ".build/keychron_q3_${v}_hardened.bin" out/
          done

      - name: Record the hashes
        run: |
          cd out
          sha256sum *.bin | tee SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect files
        run: cp users/hardened/flasher.html users/hardened/README.md out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keychron-q3-hardened
          path: out/
          if-no-files-found: error

  release:
    # Runs for a pushed hardened-q3-v* tag, or a manual run with a release name such as hardened-q3-v1
    if: startsWith(github.ref, 'refs/tags/hardened-q3-v') || startsWith(inputs.release, 'hardened-q3-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keychron-q3-hardened
          path: out
      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hardened Keychron Q3 firmware ($TAG)" \
            --notes "Built by GitHub Actions from commit $GITHUB_SHA. SHA256SUMS lists the hash of each binary; rebuilding this commit with the same compiler reproduces them. Flash with users/hardened/flasher.html or dfu-util; see users/hardened/README.md."

  # Serves flasher.html at https://<owner>.github.io/<repo>/ (Settings -> Pages -> Source: GitHub Actions)
  pages:
    if: github.ref == 'refs/heads/hardened-q3'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: users/hardened
      - name: Assemble the site
        run: |
          mkdir site
          cp users/hardened/flasher.html site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
