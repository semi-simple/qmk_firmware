# Builds the hardened Keychron Q3 firmware for all six variants, checks that the
# result is byte-identical to users/hardened/SHA256SUMS, and publishes the binaries.
#
# Toolchain is pinned to Ubuntu 24.04's gcc-arm-none-eabi 13.2.rel1-2, the same
# compiler the reference hashes were produced with. Actions are pinned by commit.
name: Hardened Keychron Q3

on:
  push:
    branches: [hardened-q3]
    tags: ['hardened-q3-v*']
    paths:
      - 'users/hardened/**'
      - 'keyboards/keychron/q3/**'
      - '.github/workflows/hardened-q3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the libraries the Q3 build needs
        run: git submodule update --init --depth 1 lib/chibios lib/chibios-contrib lib/printf lib/pico-sdk

      - name: Install the pinned toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gcc-arm-none-eabi=15:13.2.rel1-2 binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util
          arm-none-eabi-gcc --version | head -1
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements.txt

      - name: Build all variants
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          mkdir -p out
          for v in ansi ansi_encoder iso iso_encoder jis jis_encoder; do
            make "keychron/q3/$v:hardened"
            cp ".build/keychron_q3_${v}_hardened.bin" out/
          done

      - name: Check the binaries match the published hashes
        run: |
          cd out
          sha256sum *.bin | tee BUILT_SHA256SUMS
          sha256sum --check ../users/hardened/SHA256SUMS

      - name: Collect files
        run: cp users/hardened/SHA256SUMS users/hardened/flasher.html users/hardened/README.md out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keychron-q3-hardened
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/hardened-q3-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keychron-q3-hardened
          path: out
      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hardened Keychron Q3 firmware ($GITHUB_REF_NAME)" \
            --notes "Built by GitHub Actions from commit $GITHUB_SHA and checked byte-for-byte against users/hardened/SHA256SUMS. Flash with users/hardened/flasher.html or dfu-util; see users/hardened/README.md."
